[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddg"
version = "0.1.0"
description = "Advanced Discrete Differential Geometry Framework (Research-Grade)"
readme = "readme.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "DDG Contributors"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
viz = [
    "polyscope>=2.0.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "psutil>=5.9.0",
]
all = ["ddg[viz,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "geometry*", "operators*", "pde*", "spectral*", "visualization*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*Sparse invariant checks are implicitly disabled.*:UserWarning",
    "ignore:.*Sparse CSR tensor support is in beta state.*:UserWarning",
]