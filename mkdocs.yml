site_name: DDGlearn
site_description: Discrete Differential Geometry Learning Library
site_url: https://ajeetkbhardwaj.github.io/ddglearn/
repo_url: https://github.com/ajeetkbhardwaj/ddglearn

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.follow

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true

nav:
  - Home: index.md
  - Guide:
      - Getting Started: guide/getting-started.md
      - Core Meshes: guide/core.md
      - DEC Operators: guide/operators.md
      - Geometry: guide/geometry.md
      - PDE Solvers: guide/pde.md
      - Spectral: guide/spectral.md
      - Parallel: guide/parallel.md
      - Visualization: guide/visualization.md
  - Tutorials:
      - Geodesic Distance: tutorials/geodesic-distance.md
      - Spectral Shape Fingerprinting: tutorials/spectral-fingerprinting.md
      - Surface Fluids: tutorials/surface-fluids.md
      - Mesh Parameterization: tutorials/mesh-parameterization.md
      - Shape Correspondence: tutorials/shape-correspondence.md
  - API Reference:
      - Core: api/core.md
      - Geometry: api/geometry.md
      - Operators: api/operators.md
      - PDE: api/pde.md
      - Spectral: api/spectral.md
      - Parallel: api/parallel.md
  - Examples: examples.md
